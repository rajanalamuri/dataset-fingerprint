<style>
  .bg{fill:#0d1117}
  .r{fill:none;stroke:#e6edf3;stroke-width:2.6;stroke-linecap:round;stroke-dasharray:1 1;stroke-dashoffset:1;
      animation:draw 9.0s cubic-bezier(.3,.6,.3,1) infinite}
  @keyframes draw{0%{stroke-dashoffset:1;stroke:#e6edf3}38%{stroke-dashoffset:0;stroke:#e6edf3}
      44%{stroke:#ffd84a}52%{stroke:#e6edf3}88%{stroke-dashoffset:0;opacity:1}96%,100%{stroke-dashoffset:0;opacity:0}}
  .name{font:800 54px Manrope, 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif;fill:#e6edf3}
  .tag{font:600 26px Manrope, 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif;fill:#9aa3af}
  .hash rect{fill:#ffd84a} .hash text{font:600 19px 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#101418}
  .hash{clip-path:inset(0 100% 0 0);animation:type 9.0s steps(36,end) infinite}
  @keyframes type{0%,30%{clip-path:inset(0 100% 0 0);opacity:1}45%,90%{clip-path:inset(0 0 0 0);opacity:1}97%,100%{clip-path:inset(0 0 0 0);opacity:0}}
  .lbl{font:600 15px Manrope, 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif;fill:#9aa3af;opacity:0;animation:fade 9.0s infinite;animation-delay:0s}
  .chip{opacity:0;animation:chip 9.0s ease-out infinite}
  .chip rect{fill:#161b22;stroke:#30363d} .chip text{font:600 15px Manrope, 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif;fill:#e6edf3}
  .chip.st rect{fill:none}
  @keyframes chip{0%,46%{opacity:0;transform:translateY(6px)}52%,90%{opacity:1;transform:none}97%,100%{opacity:0}}
  @keyframes fade{0%,36%{opacity:0}42%,90%{opacity:1}97%,100%{opacity:0}}
  @media (prefers-reduced-motion:reduce){.r,.hash,.chip,.lbl{animation:none;stroke-dashoffset:0;clip-path:none;opacity:1}}
</style>
