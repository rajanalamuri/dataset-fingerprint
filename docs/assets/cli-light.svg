<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 434" width="880" height="434" role="img"
 aria-label="Terminal demo: install mlfingerprint, commit an S3 dataset, tag it prod, verify catches a modified file.">
<style>
  .t{font:500 17px 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;white-space:pre}
  @media (prefers-reduced-motion:reduce){text{animation:none!important;clip-path:none!important;opacity:1!important}}
</style>
<rect width="880" height="434" rx="14" fill="#101418"/>
<rect width="880" height="40" rx="14" fill="#101418"/><rect y="26" width="880" height="14" fill="#101418"/>
<line x1="0" y1="40" x2="880" y2="40" stroke="#ffffff" stroke-opacity=".08"/>
<circle cx="26" cy="20" r="6.5" fill="#ff5f57"/><circle cx="48" cy="20" r="6.5" fill="#febc2e"/><circle cx="70" cy="20" r="6.5" fill="#28c840"/>
<text x="440.0" y="25" text-anchor="middle" style="font:600 14px Manrope, 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" fill="#9aa3af">fingerprint · zsh</text>
<text x="32" y="70" class="t" fill="#e8eaed" style="clip-path:inset(0 100% 0 0);animation:type0 13.0s steps(27,end) infinite"><tspan fill="#ffd84a">$ </tspan>pip install mlfingerprint</text><style>@keyframes type0{0%,0.00%{clip-path:inset(0 100% 0 0)}7.27%,94%{clip-path:inset(0 0 0 0)}100%{clip-path:inset(0 0 0 0)}}</style><text x="32" y="100" class="t" fill="#9aa3af" style="opacity:0;animation:l1 13.0s infinite">Successfully installed mlfingerprint-0.1.0   (zero dependencies)</text><style>@keyframes l1{0%,10.77%{opacity:0}11.97%,94%{opacity:1}100%{opacity:0}}</style><text x="32" y="130" class="t" fill="#e8eaed" style="clip-path:inset(0 100% 0 0);animation:type2 13.0s steps(71,end) infinite"><tspan fill="#ffd84a">$ </tspan>fingerprint commit s3://raw/drives -n drives -m "batch 05-10" --probe</text><style>@keyframes type2{0%,16.92%{clip-path:inset(0 100% 0 0)}29.23%,94%{clip-path:inset(0 0 0 0)}100%{clip-path:inset(0 0 0 0)}}</style><text x="32" y="160" class="t" fill="#9aa3af" style="opacity:0;animation:l3 13.0s infinite">drives-v1.2.0  (minor: +42 files since drives-v1.1.1)</text><style>@keyframes l3{0%,33.85%{opacity:0}35.05%,94%{opacity:1}100%{opacity:0}}</style><text x="32" y="190" class="t" fill="#ffd84a" style="opacity:0;animation:l4 13.0s infinite">  fingerprint : sha256:9d03ca7459476ddbe1e4b0c3…8a8096</text><style>@keyframes l4{0%,36.15%{opacity:0}37.35%,94%{opacity:1}100%{opacity:0}}</style><text x="32" y="220" class="t" fill="#9aa3af" style="opacity:0;animation:l5 13.0s infinite">  splits      : train=80%  val=10%  test=10%   group_by=auto:recording</text><style>@keyframes l5{0%,38.46%{opacity:0}39.66%,94%{opacity:1}100%{opacity:0}}</style><text x="32" y="250" class="t" fill="#9aa3af" style="opacity:0;animation:l6 13.0s infinite">  modalities  : image=240k  radar=240k  imu=24 (2.1h)  audio=24 (2.0h)</text><style>@keyframes l6{0%,40.77%{opacity:0}41.97%,94%{opacity:1}100%{opacity:0}}</style><text x="32" y="280" class="t" fill="#ffb020" style="opacity:0;animation:l7 13.0s infinite">  ! 3 augmented file(s) in val/test - evaluate on real data</text><style>@keyframes l7{0%,43.08%{opacity:0}44.28%,94%{opacity:1}100%{opacity:0}}</style><text x="32" y="310" class="t" fill="#e8eaed" style="clip-path:inset(0 100% 0 0);animation:type8 13.0s steps(69,end) infinite"><tspan fill="#ffd84a">$ </tspan>fingerprint tag prod 1.2.0 &amp;&amp; fingerprint verify prod --sample 0.05</text><style>@keyframes type8{0%,50.00%{clip-path:inset(0 100% 0 0)}62.31%,94%{clip-path:inset(0 0 0 0)}100%{clip-path:inset(0 0 0 0)}}</style><text x="32" y="340" class="t" fill="#ff6b6b" style="opacity:0;animation:l9 13.0s infinite">verify drives-v1.2.0: FAILED  (64,209/64,210 files intact)</text><style>@keyframes l9{0%,66.15%{opacity:0}67.35%,94%{opacity:1}100%{opacity:0}}</style><text x="32" y="370" class="t" fill="#ff6b6b" style="opacity:0;animation:l10 13.0s infinite">  modified : val/audio/b1_0.wav        exit 1 → training never starts</text><style>@keyframes l10{0%,68.46%{opacity:0}69.66%,94%{opacity:1}100%{opacity:0}}</style>
</svg>
